<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171c">
<link rel="manifest" href="manifest.json">
<title>Mascota metálica – asistente</title>
<style>
:root{--bg:#14171c;--panel:#1d2229;--ink:#e6eaf0;--mut:#8b95a3;--acc:#7fd1ff;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#e9edf2;--panel:#fff;--ink:#1b2027;--mut:#5d6877;--acc:#0a7bc4;color-scheme:light}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px system-ui,sans-serif;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
button,input,textarea{font:inherit;color:var(--ink)}
button{background:var(--panel);border:1px solid #8884;border-radius:10px;padding:9px 13px;cursor:pointer}
button:hover{border-color:var(--acc)}
html.overlay,html.overlay body{background:transparent}
.card{display:flex;align-items:center;gap:10px;border:1px solid #8884;border-radius:12px;padding:10px;margin:8px 0;cursor:pointer}
.card .ic{font-size:28px;width:40px;text-align:center}
.card .tx{flex:1}
.card .tx small{color:var(--mut);display:block}
.card.on{border-color:var(--acc)}
.card.lock .ic{filter:grayscale(1) opacity(.55)}
.tag{background:#f5b301;color:#000;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.pro{background:linear-gradient(135deg,#f5b301,#ff7a1a);color:#000;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.fake{filter:blur(2.5px);opacity:.7;pointer-events:none}
.bars{display:flex;align-items:flex-end;gap:6px;height:60px;margin:6px 0}
.bars i{flex:1;background:var(--acc);border-radius:4px 4px 0 0}
.mb .lk{position:absolute;top:-3px;right:-3px;font-size:13px}
input[type=checkbox]{width:auto;margin:0 8px 0 0;vertical-align:middle}
select{width:100%;background:var(--panel);color:var(--ink);border:1px solid #8886;border-radius:8px;padding:8px;margin:4px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.chip{padding:6px 10px;font-size:13px;display:flex;align-items:center;gap:5px}
.chip.on{border-color:var(--acc);background:#7fd1ff22}
.chip.lock{opacity:.75}
#pro{width:100%;margin-bottom:6px}
#pro.on{background:linear-gradient(135deg,#f5b301,#ff7a1a);color:#000;border:0}
.cw{display:inline-flex;gap:2px}
.ed{padding:4px 7px;font-size:12px}
.ans{white-space:pre-wrap;word-break:break-word}
.thumb{width:40px;height:58px;object-fit:cover;border-radius:4px;background:#8883}
img.apod{width:100%;border-radius:10px;margin:6px 0}
a.lnk{color:var(--acc)}
#thought{position:fixed;left:0;top:0;max-width:min(230px,70vw);background:var(--panel);border:1px dashed var(--acc);border-radius:22px;padding:8px 13px;display:none;text-align:center;z-index:3;pointer-events:none;font-style:italic;opacity:.93}
#thought::before,#thought::after{content:"";position:absolute;background:var(--panel);border:1px dashed var(--acc);border-radius:50%}
#thought.up::before{width:10px;height:10px;left:16px;bottom:-14px}
#thought.up::after{width:6px;height:6px;left:8px;bottom:-24px}
#thought.down::before{width:10px;height:10px;left:16px;top:-14px}
#thought.down::after{width:6px;height:6px;left:8px;top:-24px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:middle;margin-right:6px;border:1px solid #8886}
#menu{position:fixed;inset:0;pointer-events:none;z-index:6}
.mb{position:fixed;left:0;top:0;width:52px;height:52px;border-radius:50%;padding:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:19px;pointer-events:auto;box-shadow:0 4px 14px #0005;border-color:var(--acc)}
.mb small{font-size:9px;color:var(--mut)}
#panel{position:fixed;left:50%;transform:translateX(-50%);width:min(440px,94vw);max-height:55vh;overflow:auto;background:var(--panel);border:1px solid #8884;border-radius:14px;padding:14px;display:none;z-index:7}
#panel.top{top:calc(12px + env(safe-area-inset-top,0px))}
#panel.bot{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
#panel h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
#panel h3 button{padding:3px 9px}
input,textarea{width:100%;background:transparent;border:1px solid #8886;border-radius:8px;padding:8px;margin:4px 0}
.note{display:flex;gap:8px;justify-content:space-between;align-items:flex-start;border-top:1px solid #8883;padding:8px 0}
.note span{white-space:pre-wrap;word-break:break-word}
.note mark{background:var(--acc);color:#000;border-radius:3px}
.mut{color:var(--mut);font-size:13px}
#bubble{position:fixed;left:0;top:0;max-width:min(260px,80vw);background:var(--panel);border:1px solid var(--acc);border-radius:14px;padding:8px 12px;display:none;text-align:center;z-index:4;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="bubble"></div>
<div id="thought"></div>
<div id="menu">
  <button class="mb" data-t="notas">📝<small>Notas</small></button>
  <button class="mb" data-t="buscar">🔍<small>Buscar</small></button>
  <button class="mb" data-t="evento">📅<small>Evento</small></button>
  <button class="mb" data-t="tiempo">⏱️<small>Tiempo</small></button>
  <button class="mb" data-t="mascotas">🐾<small>Mascotas</small></button>
  <button class="mb" data-t="web">🌐<small>Web</small></button>
  <button class="mb" data-t="config">⚙️<small>Ajustes</small></button>
</div>
<div id="panel"></div>
<script src="claves.js" onerror="void 0"></script>
<script>
// ---------- Almacenamiento ----------
const store={
  get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let notes=store.get('notes',[]);
let proOn=store.get('pro',false);      // modo prueba de Pro
let petKey=store.get('pet','ciempies');

// ---------- Lienzo ----------
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=devicePixelRatio||1;W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

// ---------- Definición de mascotas ----------
const MIN_SEG=10,MAX_SEG=26;
const D=()=>DEF[petKey];
const GL=()=>(D().glow||'#7fd1ff')+'99';   // halo neón (estilo dark)
const FAM={
  centi:{count:()=>Math.min(D().max||24,(D().n||12)+notes.length*(D().grow||1)),space:()=>D().gap||24,speed:90,fast:170,draw:wCenti},
  ant:{count:()=>3,space:i=>i===1?19:25,speed:70,fast:140,draw:wAnt},
  mantis:{count:()=>4,space:i=>[0,24,15,27][i],speed:60,fast:125,draw:wMantis},
  beetle:{count:()=>3,space:i=>i===1?17:22,speed:55,fast:115,draw:wBeetle},
  spider:{count:()=>2,space:()=>21*(D().size||1),speed:85,fast:150,draw:drawSpider},
  bee:{count:()=>3,space:i=>[0,13,19][i],speed:110,fast:200,draw:wBee},
  lady:{count:()=>2,space:()=>14,speed:60,fast:120,draw:wLady},
  dragon:{count:()=>5,space:()=>15,speed:120,fast:210,draw:wDragon},
  scorp:{count:()=>4,space:i=>[0,17,14,14][i],speed:65,fast:130,draw:wScorp}
};
const FAMS=[['centi','🐛','Ciempiés'],['ant','🐜','Hormigas'],['mantis','🦗','Mantis'],['beetle','🪲','Escarabajos'],['spider','🕷️','Arañas'],['bee','🐝','Abejas y avispas'],['lady','🐞','Mariquitas'],['dragon','🦋','Libélulas'],['scorp','🦂','Escorpiones']];
const PRICE={1:['S/ 1','≈ $0.30'],2:['S/ 2','≈ $0.55'],3:['S/ 3','≈ $0.80']};
// free:1 = gratis · p = nivel de precio Pro (1 a 3 soles)
const DEF={
  ciempies:{fam:'centi',name:'Ciempiés',ic:'🐛',free:1,hue:210,sat:12,glow:'#7fd1ff',legc:'#6a7686',n:12,gap:24,max:24,leg:22},
  ciempies_rojo:{fam:'centi',name:'Ciempiés rojo',ic:'🐛',p:1,hue:4,sat:48,glow:'#ff8a5c',legc:'#b0605a',n:12,gap:24,max:24,leg:22},
  milpies:{fam:'centi',name:'Milpiés',ic:'🐛',p:2,hue:275,sat:22,glow:'#c79bff',legc:'#7c6a96',mil:1,n:30,gap:12,max:60,grow:2,leg:10,sp:.7},
  hormiga:{fam:'ant',name:'Hormiga',ic:'🐜',free:1,hue:28,sat:38,legc:'#946c44'},
  hormiga_fuego:{fam:'ant',name:'Hormiga de fuego',ic:'🐜',p:1,hue:6,sat:62,legc:'#b4533d',sp:1.2},
  hormiga_verde:{fam:'ant',name:'Hormiga cortadora',ic:'🐜',p:1,hue:105,sat:34,legc:'#6f9a5a'},
  mantis:{fam:'mantis',name:'Mantis robótica',ic:'🦗',p:2,hue:150,sat:22},
  mantis_orquidea:{fam:'mantis',name:'Mantis orquídea',ic:'🦗',p:3,hue:330,sat:32},
  escarabajo:{fam:'beetle',name:'Escarabajo metálico',ic:'🪲',p:3,hue:195,sat:36},
  escarabajo_oro:{fam:'beetle',name:'Escarabajo dorado',ic:'🪲',p:2,hue:44,sat:62},
  escarabajo_hercules:{fam:'beetle',name:'Escarabajo Hércules',ic:'🪲',p:3,hue:125,sat:26,horn:1.6,sp:.9},
  tarantula:{fam:'spider',name:'Tarántula',ic:'🕷️',p:3,hue:25,sat:24,size:1.25,hairy:1,glow:'#ffb347',legc:'#7a6657',lw:3.4,sp:.8},
  viuda:{fam:'spider',name:'Viuda negra',ic:'🕷️',p:2,hue:220,sat:8,size:.95,hourglass:1,glow:'#ff4d4d',legc:'#2f3640',lw:2},
  saltadora:{fam:'spider',name:'Araña saltadora',ic:'🕷️',p:2,hue:200,sat:30,size:.7,bigEyes:1,glow:'#7fd1ff',legc:'#5a7388',lw:2.2,sp:.9},
  patas_largas:{fam:'spider',name:'Araña patas largas',ic:'🕷️',p:2,hue:215,sat:8,size:.9,leg:84,lw:2,arch:.3,abx:1.15,aby:.95,armor:1,glow:'#ff2d3a',legc:'#aab4c2'},
  abeja:{fam:'bee',name:'Abeja',ic:'🐝',p:2,hue:44,sat:78},
  avispa:{fam:'bee',name:'Avispa',ic:'🐝',p:2,hue:54,sat:90,slim:1,sp:1.2},
  mariquita:{fam:'lady',name:'Mariquita',ic:'🐞',p:1,hue:4,sat:72},
  mariquita_naranja:{fam:'lady',name:'Mariquita naranja',ic:'🐞',p:1,hue:26,sat:88},
  mariquita_azul:{fam:'lady',name:'Mariquita azul',ic:'🐞',p:1,hue:210,sat:56},
  libelula:{fam:'dragon',name:'Libélula',ic:'🦋',p:2,hue:190,sat:60,glow:'#7fd1ff',wing:'rgba(150,230,255,.28)'},
  libelula_roja:{fam:'dragon',name:'Libélula roja',ic:'🦋',p:2,hue:355,sat:62,glow:'#ffd27f',wing:'rgba(255,170,190,.28)'},
  escorpion:{fam:'scorp',name:'Escorpión',ic:'🦂',p:3,hue:36,sat:45,glow:'#ffb347',legc:'#a8854f'},
  escorpion_negro:{fam:'scorp',name:'Escorpión negro',ic:'🦂',p:3,hue:230,sat:10,glow:'#ff4d4d',legc:'#39424f',sp:1.1}
};
// ---------- Creador de mascotas: datos ----------
const CR_COLORS={acero:['Acero',215,8],negro:['Negro',230,6],rojo:['Rojo',355,62],naranja:['Naranja',24,80],dorado:['Dorado',44,66],verde:['Verde',130,40],turquesa:['Turquesa',180,55],azul:['Azul',215,62],violeta:['Violeta',275,45],rosa:['Rosa',330,55]};
const CR_NEON={cian:['Cian','#7fd1ff'],rojo:['Rojo','#ff2d3a'],verde:['Verde','#7dff9a'],naranja:['Naranja','#ff9a3c'],rosa:['Rosa','#ff7ac8'],violeta:['Violeta','#c79bff'],blanco:['Blanco','#f2f5f8']};
const CR_FAM={centi:['🐛','Ciempiés o milpiés'],ant:['🐜','Hormiga'],mantis:['🦗','Mantis'],beetle:['🪲','Escarabajo'],spider:['🕷️','Araña'],bee:['🐝','Abeja o avispa'],lady:['🐞','Mariquita'],dragon:['🦋','Libélula'],scorp:['🦂','Escorpión']};
function buildCustom(c){
  const col=CR_COLORS[c.color]||CR_COLORS.acero,glow=(CR_NEON[c.neon]||CR_NEON.cian)[1],fam=CR_FAM[c.fam]?c.fam:'ant';
  const d={fam,name:c.name||'Mi mascota',ic:CR_FAM[fam][0],free:1,custom:1,slot:c.slot==null?null:c.slot,hue:col[1],sat:col[2],glow,legc:`hsl(${col[1]},${Math.round(col[2]*.5)}%,58%)`,fin:{mate:-8,metal:0,cromo:14}[c.fin||'metal'],sc:Math.max(.5,Math.min(1.5,(c.tam||100)/100))};
  if(fam==='centi'){const mil=c.form==='mil',n=Math.max(6,Math.min(mil?60:26,Math.round(c.n||(mil?30:12))));
    if(mil)Object.assign(d,{mil:1,n,gap:12,max:Math.max(60,n+10),grow:2,leg:10,sp:.7});else Object.assign(d,{n,gap:24,max:Math.max(26,n+8),leg:22})}
  if(fam==='spider'){d.leg={cor:27,nor:45,lar:84}[c.legs||'nor'];d.lw=c.legs==='lar'?1.8:2.4;
    const t=c.traits||[];d.hairy=t.includes('hairy')?1:0;d.hourglass=t.includes('hour')?1:0;d.bigEyes=t.includes('eyes')?1:0;
    if(t.includes('armor')){d.armor=1;d.abx=1.15;d.aby=.95}if(c.legs==='lar')d.arch=.3}
  if(fam==='beetle')d.horn={no:0,nor:1,big:1.6}[c.horn||'nor'];
  if(fam==='bee'&&c.form==='avispa'){d.slim=1;d.sp=1.2}
  if(fam==='dragon')d.wing=`hsla(${col[1]},70%,75%,.28)`;
  return d;
}
let customs=store.get('customs',null);          // mis mascotas: yo0, yo1, …
if(!customs){const o=store.get('custom',null);customs=o?[o]:[];store.set('customs',customs);if(petKey==='custom')petKey=o?'yo0':'ciempies'}
function loadCustoms(){Object.keys(DEF).filter(k=>DEF[k].custom&&k!=='custom').forEach(k=>delete DEF[k]);customs.forEach((sp,i)=>{DEF['yo'+i]=buildCustom(Object.assign({},sp,{slot:i}))})}
loadCustoms();
if(!DEF[petKey]||(!DEF[petKey].free&&!proOn))petKey='ciempies';
let HS={x:0,y:0},segs=[],target,user=null,userUntil=0,idleUntil=0,t=0,speed=0;
let menuOpen=false,panelOpen=false;
const pet=()=>FAM[DEF[petKey].fam];
function initSegs(x=W/2,y=H/2,a=0){HS.x=x;HS.y=y;segs=[];for(let i=0;i<pet().count();i++){let o=0;for(let k=1;k<=i;k++)o+=pet().space(k);segs.push({x:x-Math.cos(a)*o,y:y-Math.sin(a)*o,a})}}
function newWander(){const mx=Math.min(60,W/4),my=Math.min(90,H/4);target={x:mx+Math.random()*Math.max(1,W-2*mx),y:my+Math.random()*Math.max(1,H-2*my)}}
newWander();initSegs();

const setUser=e=>{if(!isFinite(e.clientX)||!isFinite(e.clientY))return;user={x:Math.max(0,Math.min(W,e.clientX)),y:Math.max(0,Math.min(H,e.clientY))};userUntil=performance.now()+4000};
cv.addEventListener('pointerdown',e=>{
  const h=segs[0];
  if(Math.hypot(e.clientX-HS.x,e.clientY-HS.y)<36){            // toque en la cabeza
    if(panelOpen){closePanel();menuOpen=true}else menuOpen=!menuOpen;
    refreshUI();return;
  }
  if(menuOpen||panelOpen){menuOpen=false;closePanel()}
  setUser(e);
});
cv.addEventListener('pointermove',e=>{if(e.buttons&&!menuOpen&&!panelOpen)setUser(e)});

let frameDt=.016,nextThought=performance.now()+9000,arrived=false;
function update(dt){
  t+=dt;frameDt=dt;
  const now=performance.now(),paused=menuOpen||panelOpen;
  if(now>nextThought&&!paused){nextThought=now+13000+Math.random()*14000;if(!bubbleOn&&!thoughtOn)thinkIdle()}
  if(user&&now>=userUntil){user=null;newWander();idleUntil=now+300}      // fin de la persecución: destino nuevo
  const chasing=!!user,goal=chasing?user:target,h=segs[0];
  const dx=goal.x-HS.x,dy=goal.y-HS.y,d=Math.hypot(dx,dy);
  if(!chasing&&d<30&&now>idleUntil){idleUntil=now+(Math.random()<.5?0:600+Math.random()*1800);newWander()}
  const near=chasing&&d<20;if(near&&!arrived){arrived=true;setTimeout(()=>thinkEv('arrive'),700)}if(!chasing)arrived=false;                                              // llegó al puntero: se detiene (antes lo orbitaba)
  if(!paused&&!near){
    let da=Math.atan2(dy,dx)-h.a;da=Math.atan2(Math.sin(da),Math.cos(da));
    h.a+=da*Math.min(1,dt*3)+Math.sin(t*1.7)*dt*0.4;
  }
  let v=(chasing?pet().fast:pet().speed)*(D().sp||1)*psk();
  if(chasing)v*=Math.max(0,Math.min(1,(d-18)/90));                       // frena al acercarse
  if(paused||near||(!chasing&&now<idleUntil))v=0;
  speed+=(v-speed)*Math.min(1,dt*4);
  {const k=psk(),ox=HS.x,oy=HS.y;                                        // la cabeza avanza en pantalla; el cuerpo, en su propio mundo (más grande)
   HS.x=Math.max(24,Math.min(W-24,HS.x+Math.cos(h.a)*speed*dt));HS.y=Math.max(24,Math.min(H-24,HS.y+Math.sin(h.a)*speed*dt));
   h.x+=(HS.x-ox)/k;h.y+=(HS.y-oy)/k}
  for(let i=1;i<segs.length;i++){
    const p=segs[i-1],s=segs[i],sp=pet().space(i);
    const a=Math.atan2(p.y-s.y,p.x-s.x);
    s.x=p.x-Math.cos(a)*sp;s.y=p.y-Math.sin(a)*sp;s.a=a;
  }
  while(segs.length<pet().count()){const l=segs[segs.length-1];segs.push({x:l.x,y:l.y,a:l.a})}
  while(segs.length>pet().count())segs.pop();
  // protección: si alguna coordenada se vuelve inválida (NaN), el lienzo dibuja en la esquina (0,0); se reinicia la mascota
  if(segs.some(q=>!isFinite(q.x+q.y+q.a))){initSegs(W/2,H/2,0);speed=0;user=null;feet=null;gait=null;newWander()}
}

// ---------- Dibujo ----------
function metal(r,hue,sat){
  const g=ctx.createRadialGradient(-r*.35,-r*.35,r*.1,0,0,r);
  g.addColorStop(0,`hsl(${hue},${Math.min(100,sat+22)}%,${40+(D().fin||0)}%)`);g.addColorStop(.45,`hsl(${hue},${Math.min(100,sat+14)}%,${16+(D().fin||0)*.4}%)`);g.addColorStop(1,`hsl(${hue},${Math.min(100,sat+8)}%,5%)`);
  return g;
}
function legPts(bx,by,ax,ay,fx,fy,len,p,K=1,Bn=0){
  const sw=Math.sin(p)*8*K,lift=Math.max(0,Math.cos(p));
  return [bx+ax*len*.55+fx*(sw*.6+Bn*len),by+ay*len*.55+fy*(sw*.6+Bn*len),bx+ax*(len+lift*3)+fx*sw*1.6,by+ay*(len+lift*3)+fy*sw*1.6];
}
let legsMuted=false;
function roboLeg(bx,by,k,col,w){if(legsMuted)return;                 // eslabones metálicos, pistón, articulaciones y pie
  const [kx,ky,ex,ey]=k,g=D().glow||'#7fd1ff';
  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.strokeStyle='#0b0e12';ctx.lineWidth=w+1.8;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(kx,ky);ctx.lineTo(ex,ey);ctx.stroke();
  ctx.strokeStyle=col;ctx.lineWidth=w;ctx.stroke();
  ctx.strokeStyle='#ffffff2e';ctx.lineWidth=Math.max(.5,w*.28);ctx.stroke();
  const dx=kx-bx,dy=ky-by,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,o=w*.9;
  ctx.strokeStyle='#cfd6df88';ctx.lineWidth=Math.max(.6,w*.3);ctx.beginPath();
  ctx.moveTo(bx+nx*o+dx*.15,by+ny*o+dy*.15);ctx.lineTo(kx+nx*o-dx*.15,ky+ny*o-dy*.15);ctx.stroke();
  for(const [x,y,r] of [[bx,by,w*.75],[kx,ky,w*.7]]){ctx.fillStyle='#161b21';ctx.strokeStyle=col;ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,Math.max(1.4,r),0,7);ctx.fill();ctx.stroke()}
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(kx,ky,Math.max(.9,Math.min(2,w*.45)),0,7);ctx.fill();

function leg(bx,by,ax,ay,fx,fy,len,p,col,w,K=1,Bn=0){roboLeg(bx,by,legPts(bx,by,ax,ay,fx,fy,len,p,K,Bn),col,w)}
const rate=()=>Math.max(1.2,Math.min(14,speed/9));
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function drawCentipede(){
  const d=D(),n=segs.length,mil=!!d.mil,[wp,wi]=trickW(),ww=1-wp-wi,base=d.n||12,g=d.glow;

  ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();segs.forEach((s,i)=>i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y));
  ctx.strokeStyle='#0b0e12';ctx.lineWidth=mil?5:7;ctx.stroke();ctx.strokeStyle=g+'77';ctx.lineWidth=1.5;ctx.stroke();
  const drawLegs=()=>{
  // patas montadas sobre las placas (se ven también al girar)
  for(let i=n-1;i>=0;i--){
    const s=segs[i],fx=Math.cos(s.a),fy=Math.sin(s.a),f=i/n;
    const len=(d.leg||22)*(1-f*.28)*(i===0?.6:1),col=i>=base-1?g:d.legc;
    for(const side of[-1,1])for(let q=0;q<(mil?2:1);q++){
      const off=mil?(q?-3.5:3.5):0,R=mil?7:11,nx=-Math.sin(s.a)*side,ny=Math.cos(s.a)*side;
      const ph=t*rate()*(mil?.9:1)-i*(mil?.35:.7)+(side>0?Math.PI:0)+(mil?q*.5:0);
      const bx=s.x+fx*off+nx*R*.9,by=s.y+fy*off+ny*R*.9;
      let k=legPts(bx,by,nx,ny,fx,fy,len,ph);
      if(wp>0||wi>0){
        const ang=t*7+i*.4+q*.8+(side>0?Math.PI:0),cx=Math.cos(ang),cy=Math.sin(ang);
        const prop=[bx+cx*len*.55,by+cy*len*.55,bx+cx*len*1.1,by+cy*len*1.1];
        const ext=len*(1+.75*Math.sin(t*5+i*.5+q));
        const pis=[bx+nx*ext*.5,by+ny*ext*.5,bx+nx*ext,by+ny*ext];
        k=k.map((v,j)=>v*ww+prop[j]*wp+pis[j]*wi);
      }
      roboLeg(bx,by,k,col,mil?2:3.2);
    }
  }
  if(!mil){                                         // patas traseras largas
    const s=segs[n-1],fx=Math.cos(s.a),fy=Math.sin(s.a);
    for(const sy of[-1,1]){const a=s.a+Math.PI+sy*(.18+Math.sin(t*3+sy)*.25),bx=s.x-fx*8,by=s.y-fy*8;
      roboLeg(bx,by,[bx+Math.cos(a)*18,by+Math.sin(a)*18,bx+Math.cos(a-sy*.1)*36,by+Math.sin(a-sy*.1)*36],d.legc,2.2)}
  }
  };
  if(mil)drawLegs();   // milpiés: patas cortas por debajo del cuerpo
  // cuerpo
  for(let i=n-1;i>=0;i--){
    const s=segs[i],f=i/n,active=i>=base-1;
    ctx.save();ctx.translate(s.x,s.y);ctx.rotate(s.a);
    ctx.shadowColor=GL();ctx.shadowBlur=6;
    if(mil){                                        // anillos cilíndricos
      const r=(i===0?8.5:7.8)*(1-f*.2);
      ctx.fillStyle=metal(r*1.3,d.hue,d.sat);ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
      ctx.shadowBlur=0;ctx.strokeStyle='#0b0e12';ctx.lineWidth=1.3;ctx.stroke();
      ctx.strokeStyle='#ffffff30';ctx.beginPath();ctx.arc(0,0,r*.65,-1.3,1.3);ctx.stroke();
      if((i+Math.floor(t*7))%5===0)glowDot(0,0,1.7,g);   // luz que recorre el cuerpo
      if(i===0){
        glowDot(3,-3.5,1.8,g);glowDot(3,3.5,1.8,g);
        ctx.strokeStyle='#cfd6df';ctx.lineWidth=1.3;
        for(const sy of[-1,1]){let x=r-2,y=sy*3,a=sy*.4;ctx.beginPath();ctx.moveTo(x,y);for(let k=0;k<3;k++){a+=Math.sin(t*3+k+sy)*.35;x+=Math.cos(a)*6;y+=Math.sin(a)*6;ctx.lineTo(x,y)}ctx.stroke()}
      }
    }else{                                          // placas planas con bisel y tornillos
      const w=(i===0?22:24)*(1-f*.18),h=(i===0?20:22)*(1-f*.3),hw=w/2;
      ctx.fillStyle=metal(Math.max(w,h)*.8,d.hue,d.sat);rr(-hw,-h/2,w,h,5);ctx.fill();
      ctx.shadowBlur=0;ctx.strokeStyle='#0b0e12';ctx.lineWidth=1.4;ctx.stroke();
      ctx.strokeStyle='#ffffff2a';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-hw+3,-h/2+3);ctx.lineTo(hw-3,-h/2+3);ctx.stroke();
      ctx.fillStyle='#39424f';for(const sy of[-1,1])for(const sx of[-1,1]){ctx.beginPath();ctx.arc(sx*(hw-4),sy*(h/2-4),1.4,0,7);ctx.fill()}
      ctx.fillStyle=active?g:g+'55';ctx.fillRect(-hw*.4,-1.2,hw*.8,2.4);
      if(i===0){
        glowDot(hw*.3,-5,2.6,g);glowDot(hw*.3,5,2.6,g);
        const op=.25+.2*Math.sin(t*4);ctx.strokeStyle=d.legc;ctx.lineWidth=3;
        for(const sy of[-1,1]){ctx.beginPath();ctx.moveTo(hw-2,sy*4);ctx.quadraticCurveTo(hw+8,sy*(8-op*8),hw+14,sy*(2+op*3));ctx.stroke()}
        ctx.strokeStyle='#cfd6df';ctx.lineWidth=1.5;
        for(const sy of[-1,1]){let x=hw-4,y=sy*6,a=sy*.5;ctx.beginPath();ctx.moveTo(x,y);for(let k=0;k<4;k++){a+=Math.sin(t*3+k+sy)*.35;x+=Math.cos(a)*9;y+=Math.sin(a)*9;ctx.lineTo(x,y)}ctx.stroke();glowDot(x,y,1.6,g)}
      }
    }
    ctx.restore();
  }

}

const tripod=(s,offs,len,col,w,ph)=>{const fx=Math.cos(s.a),fy=Math.sin(s.a);offs.forEach((off,k)=>{for(const side of[-1,1]){const nx=-Math.sin(s.a)*side,ny=Math.cos(s.a)*side;leg(s.x+fx*off+nx*4,s.y+fy*off+ny*4,nx,ny,fx,fy,len,ph+((k+(side>0?1:0))%2?Math.PI:0),col,w)}})};

// ---- Arañas: marcha con pies apoyados (sin patinar) ----
let feet=null,feetKey='',gaitPh=0;
function geo(hd,k,side,L,sz){                       // base de la pata y punto de reposo del pie, en el mundo
  const fx=Math.cos(hd.a),fy=Math.sin(hd.a),dir=hd.a+side*(.9+k*.4),o=(3-k*2.2)*sz;
  const bx=hd.x+fx*o,by=hd.y+fy*o;
  return{bx,by,rx:bx+Math.cos(dir)*L*.8,ry:by+Math.sin(dir)*L*.8};
}
function stepFeet(hd,L,sz){
  // Reloj de marcha: dos grupos de 4 patas (izq/der alternadas) que se turnan, igual que en una araña real.
  const S=L*.5,sp=speed/psk(),walking=sp>10;
  if(!feet||feetKey!==petKey){feet=[];feetKey=petKey;gaitPh=0;
    for(let k=0;k<4;k++)for(const side of[-1,1]){const g=geo(hd,k,side,L,sz);feet.push({k,side,x:g.rx,y:g.ry,sx:g.rx,sy:g.ry,tx:g.rx,ty:g.ry,u:-1,dur:.1,grp:(k+(side>0?1:0))%2})}}
  const prev=gaitPh;if(walking)gaitPh+=frameDt*sp/S;           // un ciclo completo = una zancada S
  const dur=Math.min(.35*S/Math.max(sp,10),.25);                 // vuelo ≈ 35 % del ciclo, así los dos grupos nunca vuelan a la vez
  const vx=Math.cos(hd.a),vy=Math.sin(hd.a);
  for(const f of feet){
    const g=geo(hd,f.k,f.side,L,sz);
    if(f.u>=0){                                                  // pie en el aire
      f.u+=frameDt/f.dur;
      if(f.u>=1){f.u=-1;f.x=f.tx;f.y=f.ty}
      else{const e=f.u*f.u*(3-2*f.u);f.x=f.sx+(f.tx-f.sx)*e;f.y=f.sy+(f.ty-f.sy)*e}
      continue;
    }
    let go=walking&&Math.floor(gaitPh-f.grp*.5)>Math.floor(prev-f.grp*.5);   // grupo 0 en fase 0, grupo 1 en fase .5
    if(!walking){                                                // sin avanzar: corrige pies lejanos (giros en el sitio), un grupo a la vez
      const dd=Math.hypot(f.x-g.rx,f.y-g.ry);
      if(dd>L*.28&&!feet.some(o=>o.u>=0&&o.grp!==f.grp))go=true;
    }
    if(go){const lead=walking?sp*dur+S/2:0;f.sx=f.x;f.sy=f.y;f.tx=g.rx+vx*lead;f.ty=g.ry+vy*lead;f.u=0;f.dur=walking?dur:.18}
  }
}
function drawSpider(){
  const [hd,ab]=segs,d=D(),sz=d.size||1,L=(d.leg||27)*sz,l=L*.62;
  stepFeet(hd,L,sz);
  for(const f of feet){                             // cinemática inversa de 2 eslabones
    const g=geo(hd,f.k,f.side,L,sz);
    let ex=f.x,ey=f.y,dx=ex-g.bx,dy=ey-g.by,dd=Math.hypot(dx,dy)||1;
    if(dd>l*1.98){ex=g.bx+dx/dd*l*1.98;ey=g.by+dy/dd*l*1.98;dd=l*1.98}
    const lift=f.u>=0?Math.sin(Math.PI*f.u):0;
    const h=Math.sqrt(Math.max(0,l*l-dd*dd/4))*(d.arch||.5)*(1+.5*lift);

// ---------- Patas con piso para todas las mascotas (mismo método que la araña) ----------
let gait=null;
const HP=Math.PI/2;
function slotGeo(s){
  const g=segs[s.seg],ca=Math.cos(g.a),sa=Math.sin(g.a),dir=g.a+s.side*s.ang;
  const bx=g.x+ca*s.off-sa*s.side*s.R,by=g.y+sa*s.off+ca*s.side*s.R;
  return{bx,by,rx:bx+Math.cos(dir)*s.reach*.8,ry:by+Math.sin(dir)*s.reach*.8,ca,sa};
}
function walkLegs(slots,o){                       // o={S:zancada, sw:fracción de vuelo, trick:bool}
  if(!gait||gait.key!==petKey)gait={key:petKey,ph:0,feet:[]};
  const feet=gait.feet,sp=speed/psk(),walking=sp>10,prev=gait.ph;
  while(feet.length<slots.length){const g=slotGeo(slots[feet.length]);feet.push({x:g.rx,y:g.ry,sx:g.rx,sy:g.ry,tx:g.rx,ty:g.ry,u:-1,dur:.1})}
  feet.length=slots.length;
  if(walking)gait.ph+=frameDt*sp/o.S;               // un ciclo = una zancada
  const dur=Math.max(.04,Math.min(o.sw*o.S/Math.max(sp,10),.25));
  let swinging=feet.filter(f=>f.u>=0).length;const swg=[0,0];slots.forEach((s,i)=>{if(feet[i].u>=0)swg[s.po>=.5?1:0]++});   // patas en el aire por grupo
  const maxSw=Math.max(2,Math.ceil(feet.length*.4)),tw=o.trick?trickW():[0,0],wp=tw[0],wi=tw[1],ww=1-wp-wi,gl=D().glow||'#7fd1ff';
  slots.forEach((s,i)=>{
    const f=feet[i],g=slotGeo(s);
    if(f.u>=0){                                     // pie en el aire
      f.u+=frameDt/f.dur;
      if(f.u>=1){f.u=-1;f.x=f.tx;f.y=f.ty;swinging--;swg[s.po>=.5?1:0]--}
      else{const e=f.u*f.u*(3-2*f.u);f.x=f.sx+(f.tx-f.sx)*e;f.y=f.sy+(f.ty-f.sy)*e}
    }else{                                          // pie apoyado: fijo en el suelo hasta que le toque su turno
      const gr=s.po>=.5?1:0,blocked=o.block&&swg[1-gr]>0;               // los dos grupos nunca vuelan a la vez
      let go=f.pend||(walking&&Math.floor(gait.ph-s.po)>Math.floor(prev-s.po));
      if(!walking&&!f.pend&&swinging<maxSw&&!blocked&&Math.hypot(f.x-g.rx,f.y-g.ry)>s.reach*.28)go=true;   // sin avanzar: corrige giros en el sitio
      if(go&&blocked){f.pend=true;go=false}
      if(go){f.pend=false;swg[gr]++;const lead=walking?sp*dur+o.S/2:0;f.sx=f.x;f.sy=f.y;f.tx=g.rx+g.ca*lead;f.ty=g.ry+g.sa*lead;f.u=0;f.dur=walking?dur:.18;swinging++}
    }
    const l=s.reach*.62;let ex=f.x,ey=f.y,dx=ex-g.bx,dy=ey-g.by,dd=Math.hypot(dx,dy)||1;   // cinemática inversa de 2 eslabones
    if(dd>l*1.98){ex=g.bx+dx/dd*l*1.98;ey=g.by+dy/dd*l*1.98;dd=l*1.98}
    const lift=f.u>=0?Math.sin(Math.PI*f.u):0,h=Math.sqrt(Math.max(0,l*l-dd*dd/4))*(s.arch||.5)*(1+.5*lift);
    const Wx=g.ca*s.fb-g.sa*s.side,Wy=g.sa*s.fb+g.ca*s.side;
    let px=-dy/dd,py=dx/dd;if(px*Wx+py*Wy<0){px=-px;py=-py}                                // rodillas hacia afuera
    let k=[(g.bx+ex)/2+px*h,(g.by+ey)/2+py*h,ex,ey];
    if(wp>0||wi>0){                                 // movimientos "imposibles" del ciempiés y el milpiés
      const nx=-g.sa*s.side,ny=g.ca*s.side,ang=t*7+s.seg*.4+(s.q||0)*.8+(s.side>0?Math.PI:0),cx=Math.cos(ang),cy=Math.sin(ang),len=s.reach;
      const prop=[g.bx+cx*len*.55,g.by+cy*len*.55,g.bx+cx*len*1.1,g.by+cy*len*1.1],ext=len*(1+.75*Math.sin(t*5+s.seg*.5+(s.q||0))),pis=[g.bx+nx*ext*.5,g.by+ny*ext*.5,g.bx+nx*ext,g.by+ny*ext];
      k=k.map((v,j)=>v*ww+prop[j]*wp+pis[j]*wi);
    }
    roboLeg(g.bx,g.by,k,s.col,s.w);
    if(lift>0)glowDot(ex,ey,Math.max(1,s.w*.5),gl);
  });
}
const hexSlots=(seg,offs,angs,reach,w,col,R)=>{const out=[];offs.forEach((off,k)=>{for(const side of[-1,1])out.push({seg,off,side,ang:angs[k],reach:Array.isArray(reach)?reach[k]:reach,R,w,col,po:((k+(side>0?1:0))%2)*.5,fb:k===0?.3:k===offs.length-1?-.3:.1})});return out};
const mute=fn=>{legsMuted=true;try{fn()}finally{legsMuted=false}};
function tuck(seg,offs,len,col,w){                 // insectos voladores: patas recogidas, sin piso
  const g=segs[seg],ca=Math.cos(g.a),sa=Math.sin(g.a);
  offs.forEach((off,k)=>{for(const side of[-1,1]){
    const bx=g.x+ca*off-sa*side*4,by=g.y+sa*off+ca*side*4,sw=Math.sin(t*3+k*1.3+(side>0?1.7:0))*.12,nx=-sa*side,ny=ca*side;
    roboLeg(bx,by,[bx+nx*len*.5+ca*len*(.1+sw),by+ny*len*.5+sa*len*(.1+sw),bx+nx*len*.3+ca*len*(.7+sw),by+ny*len*.3+sa*len*(.7+sw)],col,w);
  }});
}
function wAnt(){walkLegs(hexSlots(1,[7,0,-7],[HP-.45,HP,HP+.45],[22,24,22],3,D().legc,5),{S:12,sw:.4,block:true});mute(drawAnt)}
function wBeetle(){walkLegs(hexSlots(1,[8,0,-12],[HP-.45,HP,HP+.45],24,3.8,'#46505e',6),{S:12,sw:.4,block:true});mute(drawBeetle)}
function wMantis(){walkLegs(hexSlots(2,[5,-7],[HP-.2,HP+.2],24,2.6,'#6f9a86',4),{S:12,sw:.4,block:true});mute(drawMantis)}
function wLady(){walkLegs(hexSlots(1,[6,0,-6],[HP-.45,HP,HP+.45],15,2.4,'#2a2a2a',4),{S:7.5,sw:.4,block:true});mute(drawLady)}
function wScorp(){const sl=[];for(let k=0;k<4;k++)for(const side of[-1,1])sl.push({seg:0,off:3-k*4,side,ang:1.2+k*.35,reach:21,R:0,w:2.4,col:D().legc,po:((k+(side>0?1:0))%2)*.5,fb:k<2?.25:-.25});walkLegs(sl,{S:10.5,sw:.35,block:true});mute(drawScorp)}
function wBee(){tuck(1,[5,0,-5],11,'#2b2b2b',2);mute(drawBee)}
function wDragon(){tuck(1,[4,0,-4],10,'#2b3440',1.8);mute(drawDragon)}
function wCenti(){
  const d=D(),mil=!!d.mil,n=segs.length,base=d.n||12,sl=[];
  for(let i=0;i<n;i++){
    const f=i/n,reach=(d.leg||22)*1.1*(1-f*.28)*(i===0?.6:1),col=i>=base-1?d.glow:d.legc;
    for(const side of[-1,1])for(let q=0;q<(mil?2:1);q++)
      sl.push({seg:i,q,off:mil?(q?-3.5:3.5):0,side,ang:HP+(mil?(q?.12:-.12):0),reach,R:mil?7:11,w:mil?2:3.2,col,po:((mil?i*.06+q*.25:i*.08)+(side>0?.5:0))%1,fb:.25,arch:.4});   // ola: cada pata va un poco desfasada de la anterior
  }
  const legs=()=>{
    walkLegs(sl,{S:(d.leg||22)*(mil?.6:.55),sw:.3,trick:true});
    if(!mil){const s=segs[n-1],fx=Math.cos(s.a),fy=Math.sin(s.a);                  // patas traseras largas
      for(const sy of[-1,1]){const a=s.a+Math.PI+sy*(.18+Math.sin(t*3+sy)*.25),bx=s.x-fx*8,by=s.y-fy*8;
        roboLeg(bx,by,[bx+Math.cos(a)*18,by+Math.sin(a)*18,bx+Math.cos(a-sy*.1)*36,by+Math.sin(a-sy*.1)*36],d.legc,2.2)}}
  };
  if(mil){legs();mute(drawCentipede)}else{mute(drawCentipede);legs()}
}

const mbs=[...document.querySelectorAll('.mb')],bubble=document.getElementById('bubble'),panel=document.getElementById('panel');
function layoutUI(){
  const h=HS,up=h.y>160;
  if(menuOpen){
    const ang=(up?[-185,-155,-125,-95,-65,-35,-5]:[185,155,125,95,65,35,5]);
    mbs.forEach((b,i)=>{
      const r=104,a=ang[i]*Math.PI/180;
      const x=Math.max(32,Math.min(W-32,h.x+Math.cos(a)*r)),y=Math.max(32,Math.min(H-32,h.y+Math.sin(a)*r));
      b.style.transform=`translate(${x-26}px,${y-26}px)`;
    });
  }
  if(bubble.style.display==='block'){
    const half=Math.min(130,W*.4),x=Math.max(half,Math.min(W-half,h.x));
    bubble.style.transform=up?`translate(${x}px,${h.y-48}px) translate(-50%,-100%)`:`translate(${x}px,${h.y+40}px) translate(-50%,0)`;
  }
  if(thoughtOn){const half=Math.min(115,W*.35),tx=Math.max(half,Math.min(W-half,h.x+50));
    thought.className=up?'up':'down';
    thought.style.transform=up?`translate(${tx}px,${h.y-58}px) translate(-50%,-100%)`:`translate(${tx}px,${h.y+48}px) translate(-50%,0)`}

function refreshUI(){
  mbs.forEach(b=>b.style.display=menuOpen?'flex':'none');
  if(menuOpen){bubble.style.display='none';hideThought()}
}
let bt,bubbleOn=false;

async function jget(url,ms=9000,headers){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal,headers});if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return await r.json()}
  finally{clearTimeout(to)}
}
async function jpost(url,body,headers,ms=15000){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{method:'POST',signal:c.signal,headers:Object.assign({'Content-Type':'application/json'},headers),body:JSON.stringify(body)});if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}return await r.json()}
  finally{clearTimeout(to)}
}

async function dictLookup(lang,w){
  const word=w.trim().toLowerCase(),base=lang.split('-')[0];let err=null,ok=false;
  const attempt=async f=>{try{const r=await f();ok=true;return r}catch(e){err=e;return null}};
  const chain=base==='es'?[()=>raeApi(word),()=>dictApi(lang,word),()=>wikt(base,word)]:[()=>dictApi(lang,word),()=>wikt(base,word)];
  let r=null;for(const f of chain){r=await attempt(f);if(r)break}
  if(!r){for(const l of ['es','en','fr','pt','de','it'].filter(x=>x!==base)){r=await attempt(()=>wikt(l,word));if(r){r.other=l;break}}}   // lo busca también en otros idiomas

}

const SW={run:false,t0:0,acc:0,laps:[]},TM={run:false,end:0,left:0,total:0};
let tmTab='sw';
const fmtT=(ms,cs)=>{const t=Math.max(0,ms),h=Math.floor(t/36e5),m=Math.floor(t/6e4)%60,s=Math.floor(t/1e3)%60,c=Math.floor(t/10)%100;return (h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+(cs?'.'+String(c).padStart(2,'0'):'')};
const swMs=()=>SW.acc+(SW.run?Date.now()-SW.t0:0),tmMs=()=>TM.run?Math.max(0,TM.end-Date.now()):TM.left;
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=880;g.gain.value=.2;o.start();let n=0;const id=setInterval(()=>{g.gain.value=n%2?0:.2;if(++n>=8){clearInterval(id);o.stop();A.close()}},250)}catch(e){}}
function alarm(){
  say(tx('¡Se acabó el tiempo!',`¡Se acabó el tiempo, ${vocat()}! ⏰`,`El tiempo ha finalizado, ${vocat()}.`),9000);beep();
  try{if(typeof Notification!=='undefined'&&Notification.permission==='granted')new Notification('⏰ Temporizador',{body:'Se acabó el tiempo'})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
}
function updTime(){
  if(TM.run&&Date.now()>=TM.end){TM.run=false;TM.left=0;alarm();if(panelOpen&&$('#td'))vTiempo()}
  if(!panelOpen)return;
  const sd=$('#sd'),td=$('#td');if(sd&&typeof sd.textContent!=='undefined'&&SW.run)sd.textContent=fmtT(swMs(),true);
  if(td&&TM.run){td.textContent=fmtT(tmMs());const pb=$('#tb');if(pb&&TM.total)pb.style.width=(100*(1-tmMs()/TM.total))+'%'}
}
setInterval(updTime,200);
function vTiempo(){
  const tabs=`<div class="chips"><button class="chip ${tmTab==='sw'?'on':''}" data-m="sw">⏱️ Cronómetro</button><button class="chip ${tmTab==='tm'?'on':''}" data-m="tm">⏳ Temporizador</button></div>`;
  let body;
  if(tmTab==='sw')body=`<div id="sd" style="font-size:34px;text-align:center;margin:8px 0">${fmtT(swMs(),true)}</div>
    <div style="text-align:center"><button id="a">${SW.run?'⏸ Pausar':'▶ Iniciar'}</button> <button id="l">🚩 Vuelta</button> <button id="r">↺ Reiniciar</button></div>
    ${SW.laps.length?`<div style="margin-top:8px">${SW.laps.map((x,i)=>`<p class="mut">Vuelta ${i+1}: ${fmtT(x,true)}</p>`).reverse().join('')}</div>`:''}`;
  else body=`<div class="chips">${[1,5,10,15,25,45].map(m=>`<button class="chip" data-p="${m}">${m} min</button>`).join('')}</div>
    <input id="tmin" type="number" min="1" step="1" placeholder="Minutos" value="${TM.total&&!TM.run?Math.round(TM.total/6e4):''}">
    <div id="td" style="font-size:34px;text-align:center;margin:8px 0">${fmtT(tmMs()||TM.total)}</div>
    <div style="height:6px;background:#8883;border-radius:4px"><div id="tb" style="height:6px;background:var(--acc);border-radius:4px;width:${TM.total&&(TM.run||TM.left)?100*(1-tmMs()/TM.total):0}%"></div></div>
    <div style="text-align:center;margin-top:8px"><button id="a">${TM.run?'⏸ Pausar':'▶ Iniciar'}</button> <button id="r">↺ Reiniciar</button></div>`;
  panel.innerHTML=head('⏱️ Tiempo')+tabs+body;wireClose();
  panel.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{tmTab=b.dataset.m;vTiempo()});
  if(tmTab==='sw'){
    $('#a').onclick=()=>{if(SW.run){SW.acc=swMs();SW.run=false}else{SW.t0=Date.now();SW.run=true}vTiempo()};
    $('#l').onclick=()=>{if(SW.run||SW.acc){SW.laps.push(swMs());vTiempo()}};
    $('#r').onclick=()=>{SW.run=false;SW.acc=0;SW.laps=[];vTiempo()};
  }else{
    panel.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{TM.run=false;TM.total=TM.left=(+b.dataset.p)*6e4;vTiempo()});
    $('#a').onclick=()=>{
      if(TM.run){TM.left=tmMs();TM.run=false}
      else{const m=parseFloat($('#tmin').value);if(m>0&&(!TM.left||m*6e4!==TM.total)){TM.total=TM.left=m*6e4}if(!TM.left)return;TM.end=Date.now()+TM.left;TM.run=true;try{if(typeof Notification!=='undefined'&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
      vTiempo();
    };
    $('#r').onclick=()=>{TM.run=false;TM.left=TM.total;vTiempo()};
  }
}

function specFromDef(id){                                     // convierte una mascota predeterminada en datos editables

  let color='acero',best=1e9;for(const [k,[,h,sa]] of Object.entries(CR_COLORS)){const dd=hd(d.hue,h)+Math.abs(d.sat-sa)*.7;if(dd<best){best=dd;color=k}}

  if(d.glow)for(const [k,[,c]] of Object.entries(CR_NEON)){const a=rgb(d.glow),b=rgb(c),dd=Math.abs(a[0]-b[0])+Math.abs(a[1]-b[1])+Math.abs(a[2]-b[2]);if(dd<b2){b2=dd;neon=k}}

addEventListener('mousemove',e=>{
  if(!OV)return;
  hover=!!(e.target.closest&&e.target.closest('.mb,#panel'))||segs.some(s=>{const k=psk(),h0=segs[0];return Math.hypot(e.clientX-(HS.x+k*(s.x-h0.x)),e.clientY-(HS.y+k*(s.y-h0.y)))<26});
});
function overlayTick(){
  if(!OV)return;
  const want=menuOpen||panelOpen||hover;
  if(want!==ovState){ovState=want;window.overlayAPI.setInteractive(want)}
}
addEventListener('keydown',e=>{if(e.key==='Escape'){menuOpen=false;closePanel();refreshUI()}});

// ---------- Bucle ----------
let last=performance.now();
(function loop(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  update(dt);ctx.clearRect(0,0,W,H);
  {const h=segs[0],k=psk();ctx.save();ctx.translate(HS.x,HS.y);ctx.scale(k,k);ctx.translate(-h.x,-h.y);groundShadow();pet().draw();ctx.restore()}
  layoutUI();overlayTick();requestAnimationFrame(loop);
})(last);
startup();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
